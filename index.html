<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F3EA" />
    <script>
      (() => {
        let mode = "system";
        try {
          mode = localStorage.getItem("store-theme") || mode;
        } catch {}
        document.documentElement.dataset.theme =
          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      })();
    </script>
    <meta
      name="description"
      content="Suit and Tie Fashion Shop. Considered menswear for every occasion. Discover tailoring, everyday essentials and the finishing touches."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta property="og:site_name" content="Suit and Tie Fashion Shop" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://suitandtiefashionshop.com/" />
    <meta property="og:title" content="Suit and Tie Fashion Shop" />
    <meta
      property="og:description"
      content="Suit and Tie Fashion Shop. Considered menswear for every occasion. Discover tailoring, everyday essentials and the finishing touches."
    />
    <meta
      property="og:image"
      content="https://suitandtiefashionshop.com/images/og-default.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json" id="seo-site-jsonld">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ClothingStore",
            "@id": "https://suitandtiefashionshop.com/#store",
            "name": "Suit and Tie Fashion Shop",

            "logo": "https://suitandtiefashionshop.com/favicon.svg",
            "image": "https://suitandtiefashionshop.com/images/og-default.jpg",
            "telephone": "+250784888458",
            "currenciesAccepted": "RWF",
            "paymentAccepted": "MTN Mobile Money"
          },
          {
            "@type": "WebSite",
            "@id": "https://suitandtiefashionshop.com/#website",
            "name": "Suit and Tie Fashion Shop",
            "url": "https://suitandtiefashionshop.com/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://suitandtiefashionshop.com/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
    <title>Suit and Tie Fashion Shop</title>
  </head>

</html>
